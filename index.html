function randomPremise(mode, current) {
  const options = mode.premises.filter((p) => p !== current);
  return options[Math.floor(Math.random() * options.length)] || mode.premises[0];
}

// ---------- Claude (text) ----------
async function callClaude(apiKey, system, user, maxTokens = 1000) {
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify({
      model: CLAUDE_MODEL,
      max_tokens: maxTokens,
      system,
      messages: [{ role: "user", content: user }],
    }),
  });
  if (!res.ok) {
    const errText = await res.text();
    throw new Error(`Claude API error ${res.status}: ${errText.slice(0, 200)}`);
  }
  const data = await res.json();
  const text = (data.content || [])
    .filter((b) => b.type === "text")
    .map((b) => b.text)
    .join("\n");
  return { text: text.trim() };
}

function stripFence(s) {
  return s.replace(/^```[a-z]*\n?/i, "").replace(/```$/i, "").trim();
}

function parseScoreJSON(raw) {
  try {
    const obj = JSON.parse(stripFence(raw));
    const nums = Object.entries(obj).filter(([k, v]) => typeof v === "number");
    const avg = nums.reduce((a, [, v]) => a + v, 0) / (nums.length || 1);
    return { obj, avg };
  } catch {
    return { obj: { note: "(the Critic's note didn't parse cleanly this round)" }, avg: 0 };
  }
}

// ---------- Cloudflare Workers AI, via a small Worker you deploy yourself (the Illustrator) ----------
// Appended to every prompt right before actual generation, regardless of mode or whether the
// Illustrator persona's own instructions were followed — this is the hard enforcement point, since
// AI image renderers reliably garble any text they're asked to render.
const NO_TEXT_RULE = " Absolutely no text, words, letters, or numbers anywhere in the image — no signage, no labels, no writing on any surface, nothing legible or illegible. If any object would normally carry writing, render it blank instead.";

async function generateIllustrationCloudflare(workerUrl, workerSecret, promptText) {
  const res = await fetch(workerUrl, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      Authorization: `Bearer ${workerSecret}`,
    },
    body: JSON.stringify({ prompt: promptText + NO_TEXT_RULE }),
  });
  const data = await res.json().catch(() => null);
  if (!res.ok) {
    throw new Error(`Worker error ${res.status}: ${(data && data.error) || "unknown"}`);
  }
  if (!data || !data.image) {
    throw new Error((data && data.error) || "Worker returned no image");
  }
  return `data:image/jpeg;base64,${data.image}`;
}

// ---------- Narration, via the same Worker → MiniMax's T2A API (your cloned/custom voice) ----------
async function narrateWithMiniMax(workerUrl, workerSecret, voiceId, text) {
  const res = await fetch(workerUrl, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      Authorization: `Bearer ${workerSecret}`,
    },
    body: JSON.stringify({ action: "speech", text, voiceId }),
  });
  const data = await res.json().catch(() => null);
  if (!res.ok) {
    throw new Error(`Worker error ${res.status}: ${(data && data.error) || "unknown"}`);
  }
  if (!data || !data.audio) {
    throw new Error((data && data.error) || "Worker returned no audio");
  }
  return `data:audio/mpeg;base64,${data.audio}`;
}

// ---------- Combine several narrated-segment audio clips into one downloadable WAV file ----------
// Uses only the browser's built-in Web Audio API — decode each MP3, concatenate the raw samples,
// re-encode as WAV by hand. No external library, since that's the one thing that's actually
// proven reliable tonight.
function encodeWav(samples, sampleRate) {
  const buffer = new ArrayBuffer(44 + samples.length * 2);
  const view = new DataView(buffer);
  function writeString(offset, str) {
    for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
  }
  writeString(0, "RIFF");
  view.setUint32(4, 36 + samples.length * 2, true);
  writeString(8, "WAVE");
  writeString(12, "fmt ");
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true); // PCM
  view.setUint16(22, 1, true); // mono
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * 2, true);
  view.setUint16(32, 2, true);
  view.setUint16(34, 16, true);
  writeString(36, "data");
  view.setUint32(40, samples.length * 2, true);
  let offset = 44;
  for (let i = 0; i < samples.length; i++, offset += 2) {
    const s = Math.max(-1, Math.min(1, samples[i]));
    view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7fff, true);
  }
  return new Blob([view], { type: "audio/wav" });
}

async function combineNarrationToWav(dataUrls) {
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  const ctx = new AudioCtx();
  try {
    const buffers = [];
    for (const url of dataUrls) {
      const arrayBuf = await (await fetch(url)).arrayBuffer();
      buffers.push(await ctx.decodeAudioData(arrayBuf));
    }
    const sampleRate = buffers[0].sampleRate;
    const totalLength = buffers.reduce((sum, b) => sum + b.length, 0);
    const combined = new Float32Array(totalLength);
    let offset = 0;
    for (const b of buffers) {
      combined.set(b.getChannelData(0), offset);
      offset += b.length;
    }
    return encodeWav(combined, sampleRate);
  } finally {
    ctx.close();
  }
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

// ---------- PDF export — final approved text + final approved illustration only, no round history ----------
function loadImageDims(dataUrl) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => resolve({ w: img.naturalWidth, h: img.naturalHeight });
    img.onerror = () => resolve(null);
    img.src = dataUrl;
  });
}

async function exportPdf(mode, premise, segments) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "pt", format: "a4" });
  const pageWidth = doc.internal.pageSize.getWidth();
  const pageHeight = doc.internal.pageSize.getHeight();
  const margin = 54;
  const contentWidth = pageWidth - margin * 2;
  let y = margin;

  const bodyFont = mode.id === "beatnik" ? "courier" : "times";
  doc.setProperties({ title: mode.title });

  function ensureSpace(neededHeight) {
    if (y + neededHeight > pageHeight - margin) {
      doc.addPage();
      y = margin;
    }
  }

  function addWrappedText(text, opts = {}) {
    const fontSize = opts.fontSize || 12;
    const lineHeight = fontSize * 1.4;
    doc.setFont(bodyFont, opts.style || "normal");
    doc.setFontSize(fontSize);
    const lines = doc.splitTextToSize(text, contentWidth);
    for (const line of lines) {
      ensureSpace(lineHeight);
      doc.text(line, margin, y);
      y += lineHeight;
    }
  }

  doc.setFont(bodyFont, "bold");
  doc.setFontSize(22);
  doc.splitTextToSize(mode.title, contentWidth).forEach((line) => {
    doc.text(line, margin, y);
    y += 26;
  });
  y += 6;
  addWrappedText(premise, { fontSize: 12, style: "italic" });
  y += 20;

  for (let i = 0; i < segments.length; i++) {
    const seg = segments[i];
    ensureSpace(30);
    doc.setFont(bodyFont, "bold");
    doc.setFontSize(10);
    doc.text(`SEGMENT ${i + 1}`, margin, y);
    y += 16;

    if (seg.image) {
      const dims = await loadImageDims(seg.image);
      const w = contentWidth * 0.6;
      const h = dims && dims.w && dims.h ? w * (dims.h / dims.w) : w;
      ensureSpace(h + 12);
      try {
        doc.addImage(seg.image, "JPEG", margin, y, w, h);
        y += h + 14;
      } catch {
        // if the image fails to embed for any reason, skip it rather than aborting the whole export
      }
    }

    addWrappedText(seg.finalPoem, { fontSize: 13 });
    y += 24;
  }

  doc.save(`${mode.id}-loom.pdf`);
}

function LoomApp({ mode, onRestart }) {
  const C = mode.palette;
  const [anthropicKey, setAnthropicKey] = useState("");
  const [workerUrl, setWorkerUrl] = useState("");
  const [workerSecret, setWorkerSecret] = useState("");
  const [minimaxVoiceId, setMinimaxVoiceId] = useState("");
  const [premise, setPremise] = useState(mode.premises[0]);
  const [segments, setSegments] = useState([]);
  const [current, setCurrent] = useState(null);
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);
  const [pdfBusy, setPdfBusy] = useState(false);
  const [narratingIndex, setNarratingIndex] = useState(null);
  const [narrationError, setNarrationError] = useState(null);
  const [narrationErrorIndex, setNarrationErrorIndex] = useState(null);
  const [segmentAudio, setSegmentAudio] = useState({}); // index -> data: URL, cached so replay/save never re-calls MiniMax
  const [fullNarrationBusy, setFullNarrationBusy] = useState(false);
  const audioRef = useRef(null);
  const scrollRef = useRef(null);

  useEffect(() => {
    scrollRef.current?.scrollIntoView({ behavior: "smooth", block: "end" });
  }, [segments.length, current]);

  if (!anthropicKey || !workerUrl || !workerSecret) {
    return (
      <ApiKeyGate
        onSubmit={(a, u, s, v) => {
          setAnthropicKey(a);
          setWorkerUrl(u);
          setWorkerSecret(s);
          setMinimaxVoiceId(v);
        }}
      />
    );
  }

  // Returns the data: URL for this segment's narration, generating it only if not already cached.
  async function getOrNarrateSegment(index, text) {
    if (segmentAudio[index]) return segmentAudio[index];
    const audioUrl = await narrateWithMiniMax(workerUrl, workerSecret, minimaxVoiceId, text);
    setSegmentAudio((prev) => ({ ...prev, [index]: audioUrl }));
    return audioUrl;
  }

  async function narrateSegment(index, text) {
    setNarrationError(null);
    setNarrationErrorIndex(null);
    setNarratingIndex(index);
    try {
      const audioUrl = await getOrNarrateSegment(index, text);
      if (audioRef.current) {
        audioRef.current.pause();
      }
      const audio = new Audio(audioUrl);
      audioRef.current = audio;
      audio.onended = () => setNarratingIndex((cur) => (cur === index ? null : cur));
      await audio.play();
    } catch (e) {
      setNarrationError(e.message || "Narration failed");
      setNarrationErrorIndex(index);
      setNarratingIndex(null);
    }
  }

  async function saveFullNarration() {
    setNarrationError(null);
    setNarrationErrorIndex(null);
    setFullNarrationBusy(true);
    try {
      const urls = [];
      for (let i = 0; i < segments.length; i++) {
        urls.push(await getOrNarrateSegment(i, segments[i].finalPoem));
      }
      const wavBlob = await combineNarrationToWav(urls);
      downloadBlob(wavBlob, `${mode.id}-narration.wav`);
    } catch (e) {
      setNarrationError(e.message || "Could not build the combined narration.");
    } finally {
      setFullNarrationBusy(false);
    }
  }

  const storySoFar = () => segments.map((s) => s.finalPoem).join("\n\n");

  async function runTextLoop(isFinal) {
    const rounds = [];
    let poem = "";
    let lastCritique = null;
    const poetSystem = mode.poetSystem(isFinal);
    for (let i = 0; i < MAX_ROUNDS; i++) {
      setCurrent((c) => ({ ...c, stageLabel: `${mode.writerLabel} (Claude) · round ${i + 1} of ${MAX_ROUNDS}` }));
      const userMsg = `Story premise: ${premise}\n\nStory so far:\n${storySoFar() || "(this is the opening segment)"}\n\n${
        lastCritique ? `Your previous draft:\n${poem}\n\nCritic's note to address:\n${lastCritique.note}` : "Write the next segment."
      }`;
      const draftRes = await callClaude(anthropicKey, poetSystem, userMsg);
      poem = draftRes.text;

      setCurrent((c) => ({ ...c, stageLabel: `Critic (Claude) reading · round ${i + 1} of ${MAX_ROUNDS}` }));
      const critiqueRaw = await callClaude(anthropicKey, mode.criticTextSystem, `Story so far:\n${storySoFar()}\n\nNew segment to score:\n${poem}`);
      const { obj, avg } = parseScoreJSON(critiqueRaw.text);
      const round = { avg, scores: obj, draft: poem };
      rounds.push(round);
      setCurrent((c) => ({ ...c, textRounds: [...rounds] }));
      lastCritique = obj;
      if (avg >= SCORE_TARGET) break;
    }
    return { poem, rounds };
  }

  async function runArtLoop(poem) {
    const rounds = [];
    let promptText = "";
    let lastCritique = null;
    for (let i = 0; i < MAX_ROUNDS; i++) {
      setCurrent((c) => ({ ...c, stageLabel: `${mode.illustratorLabel} (Claude) drafting prompt · round ${i + 1} of ${MAX_ROUNDS}` }));
      const userMsg = `Poem segment:\n${poem}\n\n${
        lastCritique ? `Your previous prompt:\n${promptText}\n\nCritic's note to address:\n${lastCritique.note}` : "Write the image-generation prompt for this segment."
      }`;
      const draftRes = await callClaude(anthropicKey, mode.illustratorSystem, userMsg);
      promptText = draftRes.text;

      setCurrent((c) => ({ ...c, stageLabel: `Critic (Claude) reading prompt · round ${i + 1} of ${MAX_ROUNDS}` }));
      const critiqueRaw = await callClaude(anthropicKey, mode.criticArtSystem, `Poem segment:\n${poem}\n\nImage prompt to critique:\n${promptText}`);
      const { obj, avg } = parseScoreJSON(critiqueRaw.text);
      const round = { avg, scores: obj, promptText };
      rounds.push(round);
      setCurrent((c) => ({ ...c, artRounds: [...rounds] }));
      lastCritique = obj;
      if (avg >= SCORE_TARGET) break;
    }
    return { promptText, rounds };
  }

  async function generateSegment() {
    setBusy(true);
    setError(null);
    const isFinal = segments.length === SEGMENT_TARGET - 1;
    setCurrent({ textRounds: [], artRounds: [], image: null, imageError: null, stageLabel: "starting…" });
    try {
      const { poem, rounds: textRounds } = await runTextLoop(isFinal);
      const { promptText, rounds: artRounds } = await runArtLoop(poem);

      let image = null;
      let imageError = null;
      setCurrent((c) => ({ ...c, stageLabel: "rendering the approved illustration…" }));
      try {
        image = await generateIllustrationCloudflare(workerUrl, workerSecret, promptText);
      } catch (e) {
        imageError = e.message || "unknown error";
      }

      setSegments((prev) => [...prev, { finalPoem: poem, textRounds, artRounds, image, imageError }]);
      setCurrent(null);
    } catch (e) {
      setError(e.message || "Something went wrong. Try again.");
      setCurrent(null);
    } finally {
      setBusy(false);
    }
  }

  const complete = segments.length >= SEGMENT_TARGET && !current;

  return (
    <div
      style={{
        minHeight: "100vh", background: C.parchment,
        backgroundImage: "radial-gradient(ellipse at top, rgba(0,0,0,0.03), transparent 60%)",
        fontFamily: "'Crimson Text', serif", color: C.ink, padding: "40px 20px 80px",
      }}
    >
      <div style={{ maxWidth: 640, margin: "0 auto" }}>
        <header style={{ textAlign: "center", marginBottom: 36 }}>
          <button
            onClick={onRestart}
            style={{ background: "none", border: "none", color: C.inkFaint, fontFamily: "'JetBrains Mono', monospace", fontSize: 10, letterSpacing: "0.05em", cursor: "pointer", textDecoration: "underline", marginBottom: 10 }}
          >
            ← choose a different form
          </button>
          <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 11, letterSpacing: "0.2em", color: C.gold, textTransform: "uppercase", marginBottom: 8 }}>
            {mode.writerLabel} & Critic (Claude) · {mode.illustratorLabel} (Cloudflare Workers AI, free) & Critic (Claude)
          </div>
          <h1 style={{ fontFamily: "'Playfair Display', serif", fontWeight: 900, fontSize: 40, margin: 0, color: C.ink }}>
            {mode.title}
          </h1>
          <p style={{ fontFamily: "'Crimson Text', serif", fontStyle: "italic", color: C.inkFaint, fontSize: 15, marginTop: 6 }}>
            {mode.subtitle}
          </p>
        </header>

        {segments.length === 0 && !current && (
          <div style={{ marginBottom: 28 }}>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
              <label style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 11, letterSpacing: "0.08em", color: C.inkFaint, textTransform: "uppercase" }}>Premise</label>
              <button
                onClick={() => setPremise(randomPremise(mode, premise))}
                style={{ background: "none", border: `1px solid ${C.gold}`, color: C.gold, borderRadius: 4, padding: "3px 10px", fontFamily: "'JetBrains Mono', monospace", fontSize: 11, letterSpacing: "0.05em", cursor: "pointer" }}
              >
                🎲 Randomize
              </button>
            </div>
            <textarea
              value={premise}
              onChange={(e) => setPremise(e.target.value)}
              rows={3}
              style={{ width: "100%", marginTop: 6, background: "#fff9ef", border: `1px solid ${C.parchmentDark}`, borderRadius: 4, padding: 10, fontFamily: "'Crimson Text', serif", fontSize: 15, color: C.ink, resize: "vertical", boxSizing: "border-box" }}
            />
          </div>
        )}

        {segments.map((seg, idx) => (
          <SegmentCard
            key={idx}
            index={idx}
            textRounds={seg.textRounds}
            artRounds={seg.artRounds}
            image={seg.image}
            imageError={seg.imageError}
            inProgress={false}
            finalText={seg.finalPoem}
            canNarrate={!!minimaxVoiceId}
            isNarrating={narratingIndex === idx}
            narrationError={narrationErrorIndex === idx ? narrationError : null}
            onNarrate={narrateSegment}
            audioUrl={segmentAudio[idx] || null}
          />
        ))}

        {current && (
          <SegmentCard index={segments.length} textRounds={current.textRounds} artRounds={current.artRounds} image={current.image} imageError={current.imageError} inProgress={true} stageLabel={current.stageLabel} />
        )}

        <div ref={scrollRef} />

        {error && <div style={{ color: C.crimson, fontSize: 13, marginBottom: 12 }}>{error}</div>}

        {complete ? (
          <div style={{ textAlign: "center", marginTop: 20 }}>
            <div style={{ fontFamily: "'Playfair Display', serif", fontWeight: 900, fontSize: 20, color: C.ink, marginBottom: 6 }}>
              The {mode.pieceNoun} is complete.
            </div>
            <div style={{ display: "flex", gap: 12, justifyContent: "center", flexWrap: "wrap" }}>
              <button
                onClick={async () => {
                  setPdfBusy(true);
                  try {
                    await exportPdf(mode, premise, segments);
                  } catch (e) {
                    setError(e.message || "Could not build the PDF.");
                  } finally {
                    setPdfBusy(false);
                  }
                }}
                disabled={pdfBusy}
                style={{
                  background: "none", color: C.gold, border: `1px solid ${C.gold}`, borderRadius: 4,
                  padding: "12px 24px", fontFamily: "'Playfair Display', serif", fontWeight: 700, fontSize: 15,
                  letterSpacing: "0.03em", cursor: pdfBusy ? "default" : "pointer", opacity: pdfBusy ? 0.6 : 1,
                }}
              >
                {pdfBusy ? "Preparing…" : "Save as PDF"}
              </button>
              {!!minimaxVoiceId && (
                <button
                  onClick={saveFullNarration}
                  disabled={fullNarrationBusy}
                  style={{
                    background: "none", color: C.gold, border: `1px solid ${C.gold}`, borderRadius: 4,
                    padding: "12px 24px", fontFamily: "'Playfair Display', serif", fontWeight: 700, fontSize: 15,
                    letterSpacing: "0.03em", cursor: fullNarrationBusy ? "default" : "pointer", opacity: fullNarrationBusy ? 0.6 : 1,
                  }}
                >
                  {fullNarrationBusy ? "Narrating…" : "🔊 Save Full Narration"}
                </button>
              )}
              <button
                onClick={onRestart}
                style={{ background: C.ink, color: C.parchment, border: "none", borderRadius: 4, padding: "12px 28px", fontFamily: "'Playfair Display', serif", fontWeight: 700, fontSize: 15, letterSpacing: "0.03em", cursor: "pointer" }}
              >
                Begin Another
              </button>
            </div>
            {narrationError && (
              <div style={{ color: C.crimson, fontSize: 13, marginTop: 10 }}>{narrationError}</div>
            )}
          </div>
        ) : (
          <div style={{ textAlign: "center", marginTop: 20 }}>
            <button
              onClick={generateSegment}
              disabled={busy}
              style={{
                background: busy ? C.parchmentDark : C.ink, color: busy ? C.inkFaint : C.parchment, border: "none",
                borderRadius: 4, padding: "12px 28px", fontFamily: "'Playfair Display', serif", fontWeight: 700,
                fontSize: 15, letterSpacing: "0.03em", cursor: busy ? "default" : "pointer",
              }}
            >
              {busy ? "Working…" : segments.length === 0 ? "Begin" : `Write Segment ${segments.length + 1} of ${SEGMENT_TARGET}`}
            </button>
            {busy && (
              <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 11, color: C.inkFaint, marginTop: 10 }}>
                stops each round when the average score reaches {SCORE_TARGET}, or after {MAX_ROUNDS} rounds
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

function Root() {
  const [mode, setMode] = useState(null);
  if (!mode) {
    return <ModeSelect onSelect={setMode} />;
  }
  return (
    <ThemeContext.Provider value={{ palette: mode.palette, mode }}>
      <LoomApp mode={mode} onRestart={() => setMode(null)} />
    </ThemeContext.Provider>
  );
}

class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { error: null };
  }
  static getDerivedStateFromError(error) {
    return { error };
  }
  render() {
    if (this.state.error) {
      return (
        <div style={{ maxWidth: 480, margin: "80px auto", padding: 24, fontFamily: "'JetBrains Mono', monospace", fontSize: 13, color: "#7A2E2E", background: "#fff9ef", border: "1px solid #7A2E2E", borderRadius: 6 }}>
          <div style={{ fontWeight: "bold", marginBottom: 8 }}>The page hit an error and stopped:</div>
          <div>{String(this.state.error.message || this.state.error)}</div>
          <div style={{ marginTop: 12, color: "#6b6152" }}>Reload the page to start again — earlier segments aren't saved between reloads.</div>
        </div>
      );
    }
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById("root")).render(
  <ErrorBoundary>
    <Root />
  </ErrorBoundary>
);
</script>
</body>
</html>
