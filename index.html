<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Story-Poem Loom</title>
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap"
/>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
  .loom-entry { animation: fadeIn 0.35s ease-out; }
  .loom-pulse { animation: pulse 1.4s ease-in-out infinite; }
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useRef, useEffect } = React;

// ---------- palette / tokens ----------
const C = {
  parchment: "#EDE4D3",
  parchmentDark: "#E1D5BC",
  ink: "#2B2620",
  inkFaint: "#6b6152",
  gold: "#A67C3D",
  goldBright: "#C79A4B",
  crimson: "#7A2E2E",
  sage: "#5C6B54",
};

const MAX_ROUNDS = 4;
const SCORE_TARGET = 8.5;
const MODEL = "claude-sonnet-4-6";

async function callClaude(apiKey, system, user, maxTokens = 1000) {
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify({
      model: MODEL,
      max_tokens: maxTokens,
      system,
      messages: [{ role: "user", content: user }],
    }),
  });
  if (!res.ok) {
    const errText = await res.text();
    throw new Error(`API error ${res.status}: ${errText.slice(0, 200)}`);
  }
  const data = await res.json();
  const stopReason = data.stop_reason;
  const text = (data.content || [])
    .filter((b) => b.type === "text")
    .map((b) => b.text)
    .join("\n");
  return { text: text.trim(), truncated: stopReason === "max_tokens" };
}

function stripFence(s) {
  return s.replace(/^```[a-z]*\n?/i, "").replace(/```$/i, "").trim();
}

function parseScoreJSON(raw) {
  try {
    const obj = JSON.parse(stripFence(raw));
    const nums = Object.entries(obj).filter(([k, v]) => typeof v === "number");
    const avg = nums.reduce((a, [, v]) => a + v, 0) / (nums.length || 1);
    return { obj, avg, ok: true };
  } catch {
    return { obj: { note: "(the Critic's note didn't parse cleanly this round)" }, avg: 0, ok: false };
  }
}

// Tolerant SVG extraction: handles a truncated response (cut off mid-tag before </svg>)
// by best-effort closing it, so a mid-generation illustration is still visible instead of vanishing.
function extractSvg(raw, truncated) {
  const s = stripFence(raw);
  const start = s.indexOf("<svg");
  if (start === -1) return { svg: null, repaired: false };
  const end = s.lastIndexOf("</svg>");
  if (end !== -1) return { svg: s.slice(start, end + 6), repaired: false };
  if (!truncated) return { svg: null, repaired: false };
  // best-effort repair: cut back to the last fully-closed tag, then close the root svg
  let body = s.slice(start);
  const lastClose = Math.max(body.lastIndexOf("/>"), body.lastIndexOf("</"));
  if (lastClose === -1) return { svg: null, repaired: false };
  const cutPoint = body.indexOf(">", lastClose) + 1;
  body = body.slice(0, cutPoint) + "</svg>";
  return { svg: body, repaired: true };
}

const POET_SYSTEM = `You are the Poet, one half of a two-AI creative duo writing a story-poem together, one segment at a time.
Write ONE segment (8-14 lines) that continues the story. Lyrical, image-rich, concrete sensory detail over abstraction. Advance the plot or feeling — don't stall.
If given critique from your collaborator (the Critic), revise substantially in response to it, don't just tweak word choice.
Reply with ONLY the poem segment. No title, no preamble, no markdown, no quotation marks around it.`;

const CRITIC_TEXT_SYSTEM = `You are the Critic, collaborator to the Poet. You read a poem segment and score it honestly and a little strictly — a score of 8+ should be rare and earned.
Score integers 1-10 on: imagery (concrete, surprising sensory detail), rhythm (sonic quality read aloud), resonance (emotional charge), continuity (fits the story so far).
Give exactly one specific, actionable note — the single change that would most improve it.
Reply with ONLY valid JSON, no markdown fences: {"imagery":n,"rhythm":n,"resonance":n,"continuity":n,"note":"..."}`;

const ILLUSTRATOR_SYSTEM = `You are the Illustrator, one half of a two-AI duo illustrating a story-poem, one segment at a time, in a spare woodcut / manuscript-illumination style.
Produce a single SVG, viewBox="0 0 400 300", using ONLY these colors: #EDE4D3 (background), #2B2620 (ink/linework), #A67C3D (gold accent), #7A2E2E (crimson accent), #5C6B54 (sage accent, sparingly).
IMPORTANT budget constraint: keep it under 12 shape/path elements total, coordinates rounded to whole numbers, no gradients or filters, no decorative flourishes with many path points — this must fit comfortably in a short response or it will be cut off.
Simple bold shapes and linework, not photorealistic. Should evoke the poem segment's central image or feeling.
If given critique, revise the composition meaningfully.
Reply with ONLY raw SVG markup starting with <svg and ending with </svg>. No markdown fences, no commentary.`;

const CRITIC_ART_SYSTEM = `You are the Critic, collaborator to the Illustrator. You look at SVG markup (reason about what it depicts from the shapes/colors/positions) and score it honestly and a little strictly.
Score integers 1-10 on: composition (balance, focal point), mood (matches the poem's feeling), restraint (not cluttered, uses the limited palette well), relevance (depicts the poem's central image).
Give exactly one specific, actionable note.
Reply with ONLY valid JSON, no markdown fences: {"composition":n,"mood":n,"restraint":n,"relevance":n,"note":"..."}`;

function Scorebar({ obj }) {
  const entries = Object.entries(obj).filter(([, v]) => typeof v === "number");
  return (
    <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginTop: 4 }}>
      {entries.map(([k, v]) => (
        <span
          key={k}
          style={{
            fontFamily: "'JetBrains Mono', monospace",
            fontSize: 11,
            color: v >= 8 ? C.sage : C.inkFaint,
            border: `1px solid ${v >= 8 ? C.sage : C.parchmentDark}`,
            borderRadius: 3,
            padding: "1px 6px",
          }}
        >
          {k} {v}
        </span>
      ))}
    </div>
  );
}

function MiniSvg({ svg, repaired }) {
  if (!svg) {
    return (
      <div
        style={{
          width: 72,
          height: 54,
          border: `1px dashed ${C.parchmentDark}`,
          borderRadius: 3,
          flexShrink: 0,
          display: "flex",
          alignItems: "center",
          justifyContent: "center",
          fontFamily: "'JetBrains Mono', monospace",
          fontSize: 9,
          color: C.inkFaint,
          textAlign: "center",
        }}
      >
        no sketch
      </div>
    );
  }
  return (
    <div
      style={{
        width: 72,
        height: 54,
        border: `1px solid ${repaired ? C.crimson : C.parchmentDark}`,
        borderRadius: 3,
        overflow: "hidden",
        flexShrink: 0,
      }}
      dangerouslySetInnerHTML={{ __html: svg }}
    />
  );
}

// Shared log renderer — used both for the live in-progress view and the finished marginalia.
function RoundLog({ rounds, kind, defaultOpen }) {
  const [open, setOpen] = useState(!!defaultOpen);
  if (!rounds.length) return null;
  const label = kind === "text" ? "Poet ↔ Critic notes" : "Illustrator ↔ Critic notes";
  return (
    <div style={{ marginTop: 10 }}>
      <button
        onClick={() => setOpen(!open)}
        style={{
          background: "none",
          border: "none",
          color: C.gold,
          fontFamily: "'JetBrains Mono', monospace",
          fontSize: 11,
          letterSpacing: "0.05em",
          cursor: "pointer",
          padding: 0,
          textTransform: "uppercase",
        }}
      >
        {open ? "▾" : "▸"} {label} · {rounds.length} round{rounds.length > 1 ? "s" : ""}
      </button>
      {open && (
        <div
          style={{
            borderLeft: `2px solid ${C.parchmentDark}`,
            marginLeft: 4,
            paddingLeft: 12,
            marginTop: 8,
            display: "flex",
            flexDirection: "column",
            gap: 12,
          }}
        >
          {rounds.map((r, i) => (
            <div key={i} className="loom-entry">
              <div
                style={{
                  fontFamily: "'JetBrains Mono', monospace",
                  fontSize: 11,
                  color: C.inkFaint,
                }}
              >
                round {i + 1}
                {r.avg != null ? ` — avg ${r.avg.toFixed(1)}` : ""}
              </div>

              {kind === "text" && r.draft && (
                <div
                  style={{
                    fontFamily: "'Crimson Text', serif",
                    fontSize: 13,
                    color: C.inkFaint,
                    marginTop: 3,
                    whiteSpace: "pre-line",
                    borderLeft: `2px solid ${C.parchmentDark}`,
                    paddingLeft: 8,
                  }}
                >
                  {r.draft}
                </div>
              )}

              {kind === "art" && (
                <div style={{ display: "flex", gap: 8, alignItems: "center", marginTop: 4 }}>
                  <MiniSvg svg={r.svg} repaired={r.repaired} />
                  {r.svgError && (
                    <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 10, color: C.crimson }}>
                      sketch didn't render this round
                    </span>
                  )}
                  {r.repaired && !r.svgError && (
                    <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 10, color: C.gold }}>
                      response was cut short — patched together
                    </span>
                  )}
                </div>
              )}

              {r.scores && Object.keys(r.scores).some(k => typeof r.scores[k] === "number") && (
                <Scorebar obj={r.scores} />
              )}
              {r.scores && r.scores.note && (
                <div
                  style={{
                    fontFamily: "'Crimson Text', serif",
                    fontStyle: "italic",
                    fontSize: 13,
                    color: C.ink,
                    marginTop: 3,
                  }}
                >
                  “{r.scores.note}”
                </div>
              )}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function DropCap({ text }) {
  if (!text) return null;
  const first = text.trim()[0] || "";
  const rest = text.trim().slice(1);
  return (
    <p
      style={{
        fontFamily: "'Crimson Text', serif",
        fontSize: 19,
        lineHeight: 1.75,
        color: C.ink,
        whiteSpace: "pre-line",
        margin: 0,
      }}
    >
      <span
        style={{
          fontFamily: "'Playfair Display', serif",
          fontSize: 56,
          color: C.crimson,
          float: "left",
          lineHeight: 0.8,
          padding: "6px 8px 0 0",
          fontWeight: 700,
        }}
      >
        {first}
      </span>
      {rest}
    </p>
  );
}

function SealStamp() {
  return (
    <div
      title="Approved by the Critic"
      style={{
        position: "absolute",
        top: 14,
        right: 14,
        width: 46,
        height: 46,
        borderRadius: "50%",
        border: `2px solid ${C.crimson}`,
        display: "flex",
        alignItems: "center",
        justifyContent: "center",
        transform: "rotate(-8deg)",
        opacity: 0.85,
      }}
    >
      <span
        style={{
          fontFamily: "'Playfair Display', serif",
          fontSize: 10,
          letterSpacing: "0.08em",
          color: C.crimson,
          textAlign: "center",
          lineHeight: 1.1,
        }}
      >
        APPROVED
      </span>
    </div>
  );
}

function StageBadge({ label }) {
  return (
    <div
      className="loom-pulse"
      style={{
        position: "absolute",
        top: 14,
        right: 14,
        fontFamily: "'JetBrains Mono', monospace",
        fontSize: 10,
        letterSpacing: "0.06em",
        color: C.gold,
        border: `1px dashed ${C.gold}`,
        borderRadius: 4,
        padding: "3px 8px",
        textTransform: "uppercase",
      }}
    >
      {label}
    </div>
  );
}

// The card used for both the finished, approved segment and the one currently being made.
function SegmentCard({ index, poem, svg, svgRepaired, textRounds, artRounds, inProgress, stageLabel }) {
  return (
    <div
      style={{
        position: "relative",
        background: "#fff9ef",
        border: `1px solid ${inProgress ? C.gold : C.parchmentDark}`,
        borderRadius: 6,
        padding: 24,
        marginBottom: 22,
        boxShadow: "0 1px 3px rgba(0,0,0,0.06)",
      }}
    >
      {inProgress ? <StageBadge label={stageLabel} /> : <SealStamp />}
      <div
        style={{
          fontFamily: "'JetBrains Mono', monospace",
          fontSize: 11,
          color: C.gold,
          letterSpacing: "0.1em",
          marginBottom: 10,
        }}
      >
        SEGMENT {index + 1}
      </div>

      {(svg || inProgress) && (
        <div
          style={{
            border: `1px solid ${svgRepaired ? C.crimson : C.parchmentDark}`,
            borderRadius: 4,
            overflow: "hidden",
            marginBottom: 16,
            maxWidth: 320,
            minHeight: svg ? undefined : 90,
            display: svg ? undefined : "flex",
            alignItems: svg ? undefined : "center",
            justifyContent: svg ? undefined : "center",
          }}
          {...(svg
            ? { dangerouslySetInnerHTML: { __html: svg } }
            : {})}
        >
          {!svg && (
            <span
              className="loom-pulse"
              style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 11, color: C.inkFaint }}
            >
              sketching…
            </span>
          )}
        </div>
      )}

      {poem ? (
        <DropCap text={poem} />
      ) : (
        <div
          className="loom-pulse"
          style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 12, color: C.inkFaint }}
        >
          the Poet is drafting…
        </div>
      )}

      <RoundLog rounds={textRounds} kind="text" defaultOpen={inProgress} />
      <RoundLog rounds={artRounds} kind="art" defaultOpen={inProgress} />
    </div>
  );
}

function ApiKeyGate({ setApiKey }) {
  const [draft, setDraft] = useState("");
  return (
    <div
      style={{
        maxWidth: 440,
        margin: "80px auto",
        background: "#fff9ef",
        border: `1px solid ${C.parchmentDark}`,
        borderRadius: 6,
        padding: 28,
        fontFamily: "'Crimson Text', serif",
      }}
    >
      <div
        style={{
          fontFamily: "'Playfair Display', serif",
          fontWeight: 900,
          fontSize: 22,
          marginBottom: 8,
          color: C.ink,
        }}
      >
        Enter your Anthropic API key
      </div>
      <p style={{ color: C.inkFaint, fontSize: 14, lineHeight: 1.5 }}>
        This file calls the Claude API directly from your browser, so it needs a key to work.
        It's kept only in this page's memory — never saved to disk or sent anywhere but api.anthropic.com — and is gone when you close the tab.
      </p>
      <input
        type="password"
        value={draft}
        onChange={(e) => setDraft(e.target.value)}
        placeholder="sk-ant-..."
        style={{
          width: "100%",
          padding: 10,
          fontFamily: "'JetBrains Mono', monospace",
          fontSize: 13,
          border: `1px solid ${C.parchmentDark}`,
          borderRadius: 4,
          marginTop: 12,
          boxSizing: "border-box",
        }}
      />
      <button
        onClick={() => setApiKey(draft.trim())}
        disabled={!draft.trim()}
        style={{
          marginTop: 14,
          width: "100%",
          background: C.ink,
          color: C.parchment,
          border: "none",
          borderRadius: 4,
          padding: "10px 0",
          fontFamily: "'Playfair Display', serif",
          fontWeight: 700,
          fontSize: 15,
          cursor: draft.trim() ? "pointer" : "default",
          opacity: draft.trim() ? 1 : 0.5,
        }}
      >
        Continue
      </button>
    </div>
  );
}

function StoryPoemLoom() {
  const [apiKey, setApiKey] = useState("");
  const [premise, setPremise] = useState(
    "A lighthouse keeper who begins receiving letters from a ship that sank a century ago."
  );
  const [segments, setSegments] = useState([]);
  const [current, setCurrent] = useState(null); // the in-progress segment, rendered live
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);
  const scrollRef = useRef(null);

  useEffect(() => {
    scrollRef.current?.scrollIntoView({ behavior: "smooth", block: "end" });
  }, [segments.length, current]);

  if (!apiKey) return <ApiKeyGate setApiKey={setApiKey} />;

  const storySoFar = () => segments.map((s) => s.finalPoem).join("\n\n");

  async function runTextLoop() {
    const rounds = [];
    let poem = "";
    let lastCritique = null;
    for (let i = 0; i < MAX_ROUNDS; i++) {
      setCurrent((c) => ({ ...c, stageLabel: `Poet · round ${i + 1} of ${MAX_ROUNDS}` }));
      const userMsg = `Story premise: ${premise}\n\nStory so far:\n${
        storySoFar() || "(this is the opening segment)"
      }\n\n${
        lastCritique
          ? `Your previous draft:\n${poem}\n\nCritic's note to address:\n${lastCritique.note}`
          : "Write the next segment."
      }`;
      const draftRes = await callClaude(apiKey, POET_SYSTEM, userMsg);
      poem = draftRes.text;
      setCurrent((c) => ({ ...c, poem }));

      setCurrent((c) => ({ ...c, stageLabel: `Critic reading · round ${i + 1} of ${MAX_ROUNDS}` }));
      const critiqueRaw = await callClaude(
        apiKey,
        CRITIC_TEXT_SYSTEM,
        `Story so far:\n${storySoFar()}\n\nNew segment to score:\n${poem}`
      );
      const { obj, avg } = parseScoreJSON(critiqueRaw.text);
      const round = { avg, scores: obj, draft: poem };
      rounds.push(round);
      setCurrent((c) => ({ ...c, textRounds: [...rounds] }));
      lastCritique = obj;
      if (avg >= SCORE_TARGET) break;
    }
    return { poem, rounds };
  }

  async function runArtLoop(poem) {
    const rounds = [];
    let svgRaw = "";
    let svg = null;
    let repaired = false;
    let lastCritique = null;
    for (let i = 0; i < MAX_ROUNDS; i++) {
      setCurrent((c) => ({ ...c, stageLabel: `Illustrator sketching · round ${i + 1} of ${MAX_ROUNDS}` }));
      const userMsg = `Poem segment to illustrate:\n${poem}\n\n${
        lastCritique
          ? `Your previous SVG:\n${svgRaw}\n\nCritic's note to address:\n${lastCritique.note}`
          : "Create the illustration."
      }`;
      let round = { avg: null, scores: {}, svg: null, repaired: false, svgError: false };
      try {
        const draftRes = await callClaude(apiKey, ILLUSTRATOR_SYSTEM, userMsg, 1000);
        svgRaw = draftRes.text;
        const extracted = extractSvg(svgRaw, draftRes.truncated);
        if (extracted.svg) {
          svg = extracted.svg;
          repaired = extracted.repaired;
        } else {
          round.svgError = true;
        }
        round.svg = svg;
        round.repaired = repaired;

        setCurrent((c) => ({ ...c, svg, svgRepaired: repaired }));

        setCurrent((c) => ({ ...c, stageLabel: `Critic viewing · round ${i + 1} of ${MAX_ROUNDS}` }));
        const critiqueRaw = await callClaude(
          apiKey,
          CRITIC_ART_SYSTEM,
          `Poem segment:\n${poem}\n\nSVG markup to assess:\n${svgRaw}`
        );
        const { obj, avg } = parseScoreJSON(critiqueRaw.text);
        round.avg = avg;
        round.scores = obj;
        lastCritique = obj;
        rounds.push(round);
        setCurrent((c) => ({ ...c, artRounds: [...rounds] }));
        if (avg >= SCORE_TARGET) break;
      } catch (e) {
        round.scores = { note: `round failed: ${e.message || "unknown error"}` };
        rounds.push(round);
        setCurrent((c) => ({ ...c, artRounds: [...rounds] }));
        break;
      }
    }
    return { svg, repaired, rounds };
  }

  async function generateSegment() {
    setBusy(true);
    setError(null);
    setCurrent({ poem: "", svg: null, svgRepaired: false, textRounds: [], artRounds: [], stageLabel: "starting…" });
    try {
      const { poem, rounds: textRounds } = await runTextLoop();
      const { svg, repaired, rounds: artRounds } = await runArtLoop(poem);
      setSegments((prev) => [
        ...prev,
        { finalPoem: poem, textRounds, svg, svgRepaired: repaired, artRounds },
      ]);
      setCurrent(null);
    } catch (e) {
      setError(e.message || "Something went wrong reaching the collaborators. Try again.");
      setCurrent(null);
    } finally {
      setBusy(false);
    }
  }

  return (
    <div
      style={{
        minHeight: "100vh",
        background: C.parchment,
        backgroundImage: "radial-gradient(ellipse at top, rgba(0,0,0,0.03), transparent 60%)",
        fontFamily: "'Crimson Text', serif",
        color: C.ink,
        padding: "40px 20px 80px",
      }}
    >
      <div style={{ maxWidth: 640, margin: "0 auto" }}>
        <header style={{ textAlign: "center", marginBottom: 36 }}>
          <div
            style={{
              fontFamily: "'JetBrains Mono', monospace",
              fontSize: 11,
              letterSpacing: "0.2em",
              color: C.gold,
              textTransform: "uppercase",
              marginBottom: 8,
            }}
          >
            Two collaborators · Poet & Critic · Illustrator & Critic
          </div>
          <h1
            style={{
              fontFamily: "'Playfair Display', serif",
              fontWeight: 900,
              fontSize: 40,
              margin: 0,
              color: C.ink,
            }}
          >
            The Story-Poem Loom
          </h1>
          <p
            style={{
              fontFamily: "'Crimson Text', serif",
              fontStyle: "italic",
              color: C.inkFaint,
              fontSize: 15,
              marginTop: 6,
            }}
          >
            Watch each segment get written and drawn, then argued over, until it earns its place on the page.
          </p>
        </header>

        {segments.length === 0 && !current && (
          <div style={{ marginBottom: 28 }}>
            <label
              style={{
                fontFamily: "'JetBrains Mono', monospace",
                fontSize: 11,
                letterSpacing: "0.08em",
                color: C.inkFaint,
                textTransform: "uppercase",
              }}
            >
              Premise
            </label>
            <textarea
              value={premise}
              onChange={(e) => setPremise(e.target.value)}
              rows={3}
              style={{
                width: "100%",
                marginTop: 6,
                background: "#fff9ef",
                border: `1px solid ${C.parchmentDark}`,
                borderRadius: 4,
                padding: 10,
                fontFamily: "'Crimson Text', serif",
                fontSize: 15,
                color: C.ink,
                resize: "vertical",
                boxSizing: "border-box",
              }}
            />
          </div>
        )}

        {segments.map((seg, idx) => (
          <SegmentCard
            key={idx}
            index={idx}
            poem={seg.finalPoem}
            svg={seg.svg}
            svgRepaired={seg.svgRepaired}
            textRounds={seg.textRounds}
            artRounds={seg.artRounds}
            inProgress={false}
          />
        ))}

        {current && (
          <SegmentCard
            index={segments.length}
            poem={current.poem}
            svg={current.svg}
            svgRepaired={current.svgRepaired}
            textRounds={current.textRounds}
            artRounds={current.artRounds}
            inProgress={true}
            stageLabel={current.stageLabel}
          />
        )}

        <div ref={scrollRef} />

        {error && <div style={{ color: C.crimson, fontSize: 13, marginBottom: 12 }}>{error}</div>}

        <div style={{ textAlign: "center", marginTop: 20 }}>
          <button
            onClick={generateSegment}
            disabled={busy}
            style={{
              background: busy ? C.parchmentDark : C.ink,
              color: busy ? C.inkFaint : C.parchment,
              border: "none",
              borderRadius: 4,
              padding: "12px 28px",
              fontFamily: "'Playfair Display', serif",
              fontWeight: 700,
              fontSize: 15,
              letterSpacing: "0.03em",
              cursor: busy ? "default" : "pointer",
            }}
          >
            {busy ? "Working…" : segments.length === 0 ? "Begin the Poem" : "Write the Next Segment"}
          </button>
          {busy && (
            <div
              style={{
                fontFamily: "'JetBrains Mono', monospace",
                fontSize: 11,
                color: C.inkFaint,
                marginTop: 10,
              }}
            >
              stops each round when the average score reaches {SCORE_TARGET}, or after {MAX_ROUNDS} rounds
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<StoryPoemLoom />);
</script>
</body>
</html>
